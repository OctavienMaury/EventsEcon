# Classement thématique : mots-clés cherchés dans le nom du séminaire.
fields:
  Macro: [macro, monetary, monétaire, business cycle, propagation]
  Micro appliquée: [applied, micro, labor, travail, health, santé, education, éducation, crime]
  Théorie: [theory, théorie, game, jeux, roy, tom, decision, mechanism]
  Économétrie: [econometric, économétrie, statistic, statistique, structural, méthodes]
  Commerce & International: [trade, commerce, international, globalization, migration]
  Développement: [development, développement, ngo, casual friday]
  Histoire & pensée: [history, histoire, pensée, thought, halbwach]
  Économie publique: [public, fiscal, tax, fiscalité, tep, protection sociale]
  Environnement: [environment, environnement, climate, climat, energy, énergie, régulation, sustainable]
  Finance: [finance, financial, banking, banque, risk, risque, assurance]
  Politique & institutions: [political, politique, institution, pepes, epci, droit, law]
  Urbain & régional: [urban, urbain, regional, régional, spatial, demographic, démographie]
